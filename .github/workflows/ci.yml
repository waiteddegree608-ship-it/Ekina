name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python scripts/validate_source.py
      - run: python -m pip install -r scripts/requirements-review-documents.txt
      - run: python -m unittest discover -s scripts -p 'test_review_*.py'
      - run: npm --prefix ekina-ui ci
      - run: npm --prefix ekina-ui run build
      - run: npm --prefix mcps/research ci
      - run: npm --prefix mcps/research test
      - run: mvn -B test '-Dtest=SkillDirectoryTest,ResearchCapabilityTest,ResearchPlanTest,ResearchLedgerTest,ResearchProjectServiceTest,ProjectBoardServiceTest,ChatMemoryServiceTest,Review*Test' '-Dsurefire.failIfNoSpecifiedTests=false'
      - run: mvn -B package -DskipTests
